  async function applyProposal(p){
    const ns=(p.noteIds||[]).map(id=>notes.find(n=>n.id===id)).filter(Boolean);
    const sources=ns.map(srcOf);
    const caseTexts=ns.filter(n=>normCat(n.cat)==='case').map(n=>({text:noteBrief(n),date:n.date,noteId:n.id}));
    let itemId=p.itemId;
    const cur=itemId&&kbItems.find(i=>i.id===itemId);
    if(p.action==='new'||!cur){
      const ref=db.collection('kb_items').doc();itemId=ref.id;
      await ref.set({prog:p.prog||'',topic:p.topic||'',title:p.title||'未命名条目',summary:p.summary||'',detail:p.detail||'',cases:caseTexts,sources,history:[],createdAt:Date.now(),updatedAt:Date.now()});
    } else {
      const patch={updatedAt:Date.now(),sources:[...(cur.sources||[]),...sources]};
      if(p.action==='case'){patch.cases=[...(cur.cases||[]),...(caseTexts.length?caseTexts:ns.map(n=>({text:noteBrief(n),date:n.date,noteId:n.id})))]}
      else{
        if(p.action==='update'&&(p.summary!==cur.summary||p.detail!==cur.detail))patch.history=[...(cur.history||[]),{summary:cur.summary,detail:cur.detail,until:Date.now(),from:cur.updatedAt||cur.createdAt||null}];
        if(p.title)patch.title=p.title;if(p.summary)patch.summary=p.summary;if(p.detail!=null)patch.detail=p.detail;
        if(caseTexts.length)patch.cases=[...(cur.cases||[]),...caseTexts];
        if(p.topic)patch.topic=p.topic;if(p.prog)patch.prog=p.prog;
      }
      await db.doc('kb_items/'+itemId).update(patch);
    }
    for(const n of ns)await db.doc('notes/'+n.id).update({kbStatus:'filed',kbItem:itemId});
  }

      if(other.length){const tb=btn('dir-item'+(kbUI.prog===p.k&&kbUI.topic==='__other'?' on':''),null,()=>{kbUI.prog=p.k;kbUI.topic='__other';render()});tb.append(el('span',null,'其他'),el('span','n',String(other.length)));grp.append(tb)}
      if(kbUI.manage&&canWrite){
        const af=el('form','dir-add');const ti=el('input');ti.id='kb-newtopic-'+p.k;ti.placeholder='新主题';ti.maxLength=20;ti.value=kbUI.newTopic[p.k];ti.oninput=()=>{kbUI.newTopic[p.k]=ti.value};
        const ab2=el('button',null,'添加');ab2.type='submit';af.append(ti,ab2);
        af.onsubmit=e=>{e.preventDefault();const v=ti.value.trim();if(!v||topics(p.k).includes(v))return;kbUI.newTopic[p.k]='';saveTopics(p.k,[...topics(p.k),v])};
        grp.append(af);
      }
      dir.append(grp);
    }
    if(canWrite)dir.append(btn('linkish',kbUI.manage?'完成':'管理主题',()=>{kbUI.manage=!kbUI.manage;render()}));
    lay.append(dir);

    const main=el('div','kb-main');
    let list=kbItems.filter(i=>(kbUI.prog==='all'||i.prog===kbUI.prog)&&(!kbUI.topic||(kbUI.topic==='__other'?!topics(i.prog).includes(i.topic):i.topic===kbUI.topic))&&matchQ(itemText(i)));
    list.sort((a,b)=>(a.prog+a.topic).localeCompare(b.prog+b.topic,'zh')||(b.updatedAt||0)-(a.updatedAt||0));
    const crumb=el('div','kb-crumb',(kbUI.prog==='all'?'全部业务':progName(kbUI.prog))+(kbUI.topic?' / '+(kbUI.topic==='__other'?'其他':kbUI.topic):'')+(kbUI.q.trim()?' · 搜索「'+kbUI.q.trim()+'」':'')+' · '+list.length+' 条');
    main.append(crumb);
    if(!kbReady)main.append(el('div','empty','正在加载…'));
    else if(!list.length)main.append(el('div','empty',kbItems.length?'这里还没有符合条件的条目。':'知识库还是空的。点上方「整理入库」，把待整理的记录收进来。'));
    for(const it of list)main.append(kbUI.edit&&kbUI.edit.id===it.id?renderItemEdit():renderItem(it));
    // 搜索时也显示待整理里的匹配
    if(kbUI.q.trim()){
      const pm=pend.filter(n=>matchQ(noteBrief(n)+' '+(n.meeting||'')+' '+(n.people||'')));
      if(pm.length){const pw=el('div','kb-pmatch');pw.append(el('div','older-title','待整理里的匹配 · '+pm.length));for(const n of pm)pw.append(el('div','pm-row',fmtDay(n.date)+'　'+noteBrief(n)));main.append(pw)}
    }
    lay.append(main);
    box.append(lay);
  }

  function renderItem(it){
    const open=kbUI.openItems.has(it.id)||!!kbUI.q.trim();
    const card=el('article','kb-item'+(open?' open':''));
    const top=el('div','kb-item-top');
    const h=el('h3','kb-title');const tb=btn('kb-title-btn',(open?'▾ ':'▸ ')+it.title,()=>{open?kbUI.openItems.delete(it.id):kbUI.openItems.add(it.id);render()},(open?'收起：':'展开全文：')+it.title);
    tb.setAttribute('aria-expanded',open);h.append(tb);
    const tt=el('div');tt.append(h);
    const tags=el('div','nmeta');tags.append(el('span','tag p-'+it.prog,progShort(it.prog)),el('span','tag',it.topic||'未分主题'));
    if((it.history||[]).length)tags.append(el('span','tag t-optimize','改过 '+it.history.length+' 次'));
    tags.append(el('span','who','更新于 '+fmtTs(it.updatedAt||it.createdAt)));
    tt.append(tags);top.append(tt);
    if(canWrite){const acts=el('div','row-acts');
      acts.append(btn(null,'编辑',()=>{kbUI.edit={id:it.id,prog:it.prog,topic:it.topic,title:it.title,summary:it.summary,detail:it.detail||'',keep:true};render();const t=$('kbe-summary');if(t)t.focus()}));
      acts.append(btn(kbUI.confirmDel===it.id?'sure':null,kbUI.confirmDel===it.id?'确认删除':'删除',async()=>{if(kbUI.confirmDel===it.id){kbUI.confirmDel=null;try{await db.doc('kb_items/'+it.id).delete();for(const n of notes.filter(n=>n.kbItem===it.id))await db.doc('notes/'+n.id).update({kbStatus:'',kbItem:''})}catch(e){fail(e)}}else{kbUI.confirmDel=it.id;render()}}));
      top.append(acts)}
    card.append(top);
    card.append(el('p','kb-summary'+(open?'':' clamp'),it.summary));
    if(!open){
      const more=[it.detail?'细节':'',(it.cases||[]).length?'个案 '+it.cases.length:'',(it.sources||[]).length?'原始记录 '+it.sources.length:'',(it.history||[]).length?'历史 '+it.history.length:''].filter(Boolean);
      if(more.length)card.append(btn('linkish kb-more','展开全文（'+more.join(' · ')+'）',()=>{kbUI.openItems.add(it.id);render()}));
      return card;
    }
    if(it.detail)card.append(el('div','kb-detail',it.detail));
    if((it.cases||[]).length){const cw=el('div','kb-cases');cw.append(el('div','kb-label','相关个案'));const ul=el('ul');for(const c of it.cases){const li=el('li');li.append(el('span','who',fmtDay(c.date)+'　'),document.createTextNode(c.text));ul.append(li)}cw.append(ul);card.append(cw)}
    const orig=(it.sources||[]).map(s=>notes.find(n=>n.id===s.noteId)).filter(Boolean);
    if(orig.length){const ow=el('div','kb-orig');ow.append(el('div','kb-label','原始记录'));
      for(const n of orig){const r=el('div','orig-row');r.append(el('div','who',fmtDay(n.date)+(n.meeting?' · '+n.meeting:'')),el('div','orig-text',noteBrief(n)));ow.append(r)}card.append(ow)}
    if((it.sources||[]).length){const sw=el('div','kb-src');sw.append(el('span','kb-label','来源'));
      for(const s of it.sources){sw.append(el('span','src-chip',[fmtDay(s.date),s.meeting,s.people?'@'+s.people:''].filter(Boolean).join(' · ')))}card.append(sw)}
    if((it.history||[]).length){const d=el('details','kb-hist');d.append(el('summary',null,'历史版本（'+it.history.length+'）'));
      for(const h of [...it.history].reverse()){const hv=el('div','hist-row');hv.append(el('div','who',(h.from?fmtTs(h.from):'')+' – '+fmtTs(h.until)),el('div',null,h.summary));if(h.detail)hv.append(el('div','kb-detail',h.detail));d.append(hv)}
      card.append(d)}
    return card;
  }
  function renderItemEdit(){
    const e=kbUI.edit;const f=el('form','kb-item form');f.noValidate=true;
    const pf=el('div','fld span3');pf.append('业务');pf.append(chipGroup(PROGS.map(p=>({k:p.k,n:p.short,cls:'p-'+p.k})),e.prog,k=>{e.prog=k;if(!topics(k).includes(e.topic))e.topic=topics(k)[0];render()},'kbe-prog-'));f.append(pf);
    const tf=el('label','fld span3');tf.append('主题');const ts=el('select');ts.id='kbe-topic';for(const t of topics(e.prog)){const o=el('option',null,t);o.value=t;if(t===e.topic)o.selected=true;ts.append(o)}ts.onchange=()=>{e.topic=ts.value};tf.append(ts);f.append(tf);
    const mk=(lab,id,key,cls,ta)=>{const l=el('label','fld '+cls);l.append(lab);const i=el(ta?'textarea':'input',ta?'grow':null);i.id=id;i.value=e[key];if(ta){i.dataset.grow='1';autoGrow(i)}i.oninput=()=>{e[key]=i.value};l.append(i);return l};
    f.append(mk('标题','kbe-title','title','span6'));
    f.append(mk('一句话结论','kbe-summary','summary','span6',true));
    f.append(mk('细节与适用条件','kbe-detail','detail','span6',true));
    const acts=el('div','form-acts span6');
    const sb=el('button','primary','保存');sb.type='submit';acts.append(sb);
    const cl=el('label','chk-line');const cb=el('input');cb.type='checkbox';cb.id='kbe-keep';cb.checked=e.keep;cb.onchange=()=>{e.keep=cb.checked};cl.append(cb,'规则有变化，把旧版本保存到历史');acts.append(cl);
    acts.append(btn(null,'取消',()=>{kbUI.edit=null;render()}));
    f.append(acts);
    f.onsubmit=async ev=>{ev.preventDefault();const cur=kbItems.find(i=>i.id===e.id);if(!cur){kbUI.edit=null;render();return}
      const patch={prog:e.prog,topic:e.topic,title:e.title.trim()||cur.title,summary:e.summary.trim(),detail:e.detail.trim(),updatedAt:Date.now()};
      if(e.keep&&(patch.summary!==cur.summary||patch.detail!==(cur.detail||'')))patch.history=[...(cur.history||[]),{summary:cur.summary,detail:cur.detail||'',until:Date.now(),from:cur.updatedAt||cur.createdAt||null}];
      kbUI.edit=null;render();try{await db.doc('kb_items/'+e.id).update(patch)}catch(err){fail(err)}};
    return f;
  }

  function renderSortPanel(pend){
    const p=el('section','panel kb-sort');
    const h=el('div','panel-head');
    const hl=el('div');hl.append(el('div','sec-title small','整理入库'),el('div','range',kbDraft?'Claude 的整理建议，逐条确认或修改后收录。':pend.length?'有 '+pend.length+' 条记录待整理：规则/口径、Host 个案、已采纳的想法、已确认的问题。建议每周整理一次。':'没有待整理的记录。'));
    const acts=el('div','acts');
    if(kbDraft){
      acts.append(btn('btn primary','确认收录所选（'+kbDraft.proposals.filter(x=>x.include!==false).length+'）',confirmDraft));
      acts.append(btn('btn','放弃这次建议',discardDraft));
    } else if(pend.length){
      if(kbUI.sorting)acts.append(btn('btn',  '停止',()=>{if(kbUI.sortCtl)kbUI.sortCtl.abort()}));
      else if(sampleFn)acts.append(btn('btn primary','让 Claude 整理 '+pend.length+' 条',runSort));
    }
    h.append(hl,acts);p.append(h);
    if(kbUI.sorting)p.append(el('div','hint pad','正在处理，可能需要半分钟…'));
    if(kbUI.sortErr)p.append(el('div','err pad',kbUI.sortErr));
    if(kbDraft){
      const ol=el('ol','draft-list');
      kbDraft.proposals.forEach((pr,i)=>{
        const li=el('li','draft'+(pr.include===false?' off':''));
        const hd=el('div','draft-hd');
        const cl=el('label','chk-line');const cb=el('input');cb.type='checkbox';cb.id='dr-'+i+'-inc';cb.checked=pr.include!==false;cb.onchange=()=>{pr.include=cb.checked;saveDraft()};cl.append(cb,'收录');
        const actName={new:'新条目',merge:'补充到已有条目',update:'更新已有条目（旧版存入历史）',case:'作为已有条目的个案'}[pr.action];
        const target=pr.itemId&&kbItems.find(x=>x.id===pr.itemId);
        hd.append(cl,el('span','tag '+(pr.action==='new'?'p-drh':'t-optimize'),actName),el('span','tag',progShort(pr.prog)+' / '+pr.topic));
        if(target)hd.append(el('span','who','→ '+target.title));
        li.append(hd);
        if(kbUI.draftEdit===i){
          const f=el('div','draft-edit');
          const ts=el('select');ts.id='dr-'+i+'-topic';for(const p2 of PROGS)for(const t of topics(p2.k)){const o=el('option',null,p2.short+' / '+t);o.value=p2.k+'|'+t;if(p2.k===pr.prog&&t===pr.topic)o.selected=true;ts.append(o)}
          ts.onchange=()=>{const [a,b]=ts.value.split('|');pr.prog=a;pr.topic=b};
          const as=el('select');as.id='dr-'+i+'-act';
          const opts=[['new','新条目']];if(kbItems.length)opts.push(['merge','补充到已有条目'],['update','更新已有条目'],['case','作为个案']);
          for(const [k,n] of opts){const o=el('option',null,n);o.value=k;if(k===pr.action)o.selected=true;as.append(o)}
          as.onchange=()=>{pr.action=as.value;if(pr.action!=='new'&&!pr.itemId&&kbItems[0])pr.itemId=kbItems[0].id;render()};
          f.append(ts,as);
          if(pr.action!=='new'){const is=el('select');is.id='dr-'+i+'-item';for(const it of kbItems){const o=el('option',null,it.title);o.value=it.id;if(it.id===pr.itemId)o.selected=true;is.append(o)}is.onchange=()=>{pr.itemId=is.value};f.append(is)}
          const mk=(ph,key,id)=>{const t=el('textarea','grow');t.id=id;t.placeholder=ph;t.value=pr[key];t.dataset.grow='1';autoGrow(t);t.oninput=()=>{pr[key]=t.value};return t};
          if(pr.action!=='case'){f.append(mk('标题','title','dr-'+i+'-title'),mk('一句话结论','summary','dr-'+i+'-sum'),mk('细节与适用条件（可空）','detail','dr-'+i+'-det'))}
          f.append(btn('btn primary','完成修改',()=>{kbUI.draftEdit=null;saveDraft();render()}));
          li.append(f);
        } else {
          if(pr.action!=='case'){li.append(el('div','kb-title sm',pr.title));li.append(el('div',null,pr.summary));if(pr.detail)li.append(el('div','kb-detail',pr.detail))}
          li.append(btn('linkish','修改',()=>{kbUI.draftEdit=i;render()}));
        }
        const srcs=el('div','draft-src');srcs.append(el('span','kb-label','来自记录'));
        for(const id of pr.noteIds){const n=notes.find(x=>x.id===id);if(n)srcs.append(el('div','pm-row',fmtDay(n.date)+'　'+noteBrief(n)))}
        li.append(srcs);ol.append(li);
      });
      p.append(ol);
    } else if(pend.length&&!kbUI.sorting){
      const ul=el('ul','pend-list');
      for(const n of pend){
        const li=el('li','pm-row');const c=normCat(n.cat);
        li.append(el('span','chip c-'+(c||'none'),catName(c)||'记录'),el('span','t',noteBrief(n)),el('span','from',shortLabel('day',n.date)));
        const acts=el('span','row-acts');
        acts.append(btn(null,'手动收录',()=>{const pr=n.prog==='impact'?'impact':'drh';kbDraft={proposals:[{key:'h'+n.id,noteIds:[n.id],action:'new',itemId:'',prog:pr,topic:topics(pr)[0],title:n.text.slice(0,16),summary:noteBrief(n),detail:'',include:true}],createdAt:Date.now()};kbUI.draftEdit=0;saveDraft();render()}));
        acts.append(btn(null,'不收录',()=>put('notes',n.id,{kbStatus:'skip'})));
        li.append(acts);ul.append(li);
      }
      p.append(ul);
      if(!sampleFn)p.append(el('div','hint pad','Claude 整理当前不可用，可以逐条「手动收录」。'));
    }
    return p;
  }

  render();

  (async()=>{
    try{
      const c=window.claude;
      db=c&&c.use?await c.use('db'):null;
      const user=c&&c.use?await c.use('user'):null;
      if(user&&user.can){const w=await user.can('data.write');if(w===false)canWrite=false}
    }catch(e){db=null}
    try{if(window.claude&&window.claude.use)window.claude.use('assets').then(a=>{assetsFn=a||null;render()},()=>{})}catch(e){}
    try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(a=>{downloadsFn=a||null;render()},()=>{})}catch(e){}
    try{if(window.claude&&window.claude.use)window.claude.use('sample').then(f=>{sampleFn=f||null;render()},()=>{})}catch(e){}
    if(!db){ready=true;canWrite=false;render();return}
    const got=new Set();const mark=c=>{got.add(c);if(got.size>=3)ready=true};
    const sub=(coll,set)=>db.collection(coll).onSnapshot(snap=>{set(snap.docs.map(d=>Object.assign({id:d.id},d.data())));mark(coll);render()},()=>{mark(coll);render()});
    sub('goals',v=>{goals=v});
    db.collection('tasks').onSnapshot(snap=>{tasks=snap.docs.map(d=>Object.assign({id:d.id},d.data()));tasksReady=true;render()},()=>{tasksReady=true;render()});
    sub('events',v=>{events=v;if(evForm.id&&!events.some(e=>e.id===evForm.id))resetEv()});
    sub('notes',v=>{notes=v;if(ntForm.id&&!notes.some(x=>x.id===ntForm.id))resetNt()});
    db.collection('kb_items').onSnapshot(snap=>{kbItems=snap.docs.map(d=>Object.assign({id:d.id},d.data()));kbReady=true;render()},()=>{kbReady=true;render()});
    db.collection('kbmeta').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});kbmetaDocs=m;kbConfig=m.config||null;routines=m.routines&&Array.isArray(m.routines.items)?m.routines.items:[];kbDraft=m.draft&&Array.isArray(m.draft.proposals)&&m.draft.proposals.length?m.draft:null;render()},()=>{});
  })();
})();
</script>
