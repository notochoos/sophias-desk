<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sophia's Desk：日程与会议议题、月/周/日目标、速记和知识库的个人工作台。数据只存在你自己的浏览器里。">
<style>:root{box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Sophia's Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a planner page read top to bottom — 日程 (only booked slots) → 三栏目标 (月/周/日) → Learnings & Task; 周报 opens under the header */
:root{
  --paper:#F1F4F2; --sheet:#FFFFFF; --ink:#1C2724; --muted:#66736F; --line:#DCE3DF;
  --accent:#1E6B5C; --accent-soft:#E2EFEB;
  --ok:#2F7D4F; --warn:#A86A12; --warn-soft:#F7ECD9; --bad:#B5473A; --bad-soft:#F6E3E0;
  --mtg:#1E5F6B; --mtg-soft:#DCEDF0; --dsc:#5B4B9A; --dsc-soft:#E9E5F6; --oth:#5E6A66; --oth-soft:#E8ECEA;
  --f-display:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111715; --sheet:#19211F; --ink:#E5ECE9; --muted:#93A19C; --line:#2B3632;
  --accent:#62B9A3; --accent-soft:#1F332E;
  --ok:#6CC08A; --warn:#E2AA4E; --warn-soft:#352A17; --bad:#E3806F; --bad-soft:#3A2220;
  --mtg:#7CC6D4; --mtg-soft:#1C3237; --dsc:#B5A6EE; --dsc-soft:#2A2540; --oth:#A9B5B0; --oth-soft:#262E2C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111715; --sheet:#19211F; --ink:#E5ECE9; --muted:#93A19C; --line:#2B3632;
  --accent:#62B9A3; --accent-soft:#1F332E;
  --ok:#6CC08A; --warn:#E2AA4E; --warn-soft:#352A17; --bad:#E3806F; --bad-soft:#3A2220;
  --mtg:#7CC6D4; --mtg-soft:#1C3237; --dsc:#B5A6EE; --dsc-soft:#2A2540; --oth:#A9B5B0; --oth-soft:#262E2C; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.7rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 11px;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:600}
.nav .date{font-family:var(--f-display);font-weight:600;font-size:1.05rem;padding:0 8px;min-width:10ch;text-align:center}
.nav input[type=date]{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 8px;font:inherit;font-size:.85rem;color:var(--ink)}

.notice{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.notice button{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:3px 10px;font-size:.85rem}

.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-head{padding:16px 18px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.range{color:var(--muted);font-size:.82rem}
.code{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.03em}
.sum{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.sum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.hint{font-size:.8rem;color:var(--muted)}
.empty{padding:18px;color:var(--muted);font-size:.88rem;text-align:center}

/* ---- 周报 ---- */
.report{border-color:var(--accent)}
.report textarea{display:block;width:100%;box-sizing:border-box;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.9rem;line-height:1.7;padding:14px 18px;resize:vertical;min-height:320px}
.report .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---- 日程 ---- */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0 18px 12px}
.wk button{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.wk button:hover{border-color:var(--accent)}
.wk button.on{border-color:var(--accent);background:var(--accent-soft)}
.wk .wd{font-size:.72rem;color:var(--muted)}
.wk .dn{font-family:var(--f-display);font-weight:600;font-size:.98rem;font-variant-numeric:tabular-nums}
.wk button.today .dn{color:var(--accent)}
.wk .n{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);height:1.1em}
ul.agenda{list-style:none;margin:0;padding:0 8px 6px;display:flex;flex-direction:column}
.ag{display:grid;grid-template-columns:7.4em minmax(0,1fr) auto;gap:2px 14px;align-items:start;padding:11px 10px;border-top:1px solid var(--line)}
.ag:first-child{border-top:0}
.ag .tm{font-family:var(--f-mono);font-size:.95rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.ag .tm small{display:block;font-size:.74rem;color:var(--muted);font-weight:400}
.ag .what{display:flex;flex-direction:column;gap:3px;min-width:0}
.ag .ttl{font-weight:600;overflow-wrap:anywhere}
.ag .info{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted)}
.ag .info span{overflow-wrap:anywhere}
.ag .mno{font-family:var(--f-mono);color:var(--ink)}
.ag.past .tm,.ag.past .ttl{color:var(--muted)}
.ag.live .tm{color:var(--bad)}
.copy{border:1px solid var(--line);background:transparent;border-radius:5px;padding:0 6px;font-size:.72rem;color:var(--muted);margin-left:4px}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.kind{font-size:.72rem;border-radius:5px;padding:0 6px;line-height:1.6;align-self:flex-start}
.k-meeting{background:var(--mtg-soft);color:var(--mtg)}
.k-discussion{background:var(--dsc-soft);color:var(--dsc)}
.k-other{background:var(--oth-soft);color:var(--oth)}
.row-acts{display:flex;gap:2px;opacity:.55}
.ag:hover .row-acts,.ag:focus-within .row-acts,li.item:hover .row-acts,li.item:focus-within .row-acts,.nt:hover .row-acts,.nt:focus-within .row-acts{opacity:1}
.row-acts button{background:transparent;border:0;border-radius:6px;padding:2px 6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.row-acts button:hover{background:var(--line);color:var(--ink)}
.row-acts button.push:hover{color:var(--warn)}
.row-acts button.sure{color:var(--bad);font-weight:600}

form.form{border-top:1px dashed var(--line);padding:14px 18px 16px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px;align-items:end}
@media (max-width:760px){form.form{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 9px;font:inherit;font-size:.9rem;color:var(--ink);min-width:0}
.fld textarea{resize:vertical;min-height:2.6em;line-height:1.5}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:1/-1}
@media (max-width:760px){.span2,.span3,.span4{grid-column:1/-1}.half{grid-column:span 1}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:3px 12px;font-size:.84rem}
.chips button.on{border-color:currentColor;font-weight:600}
.form-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form-acts button{border-radius:8px;padding:7px 14px;font-size:.88rem;border:1px solid var(--line);background:var(--sheet)}
.form-acts .primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:600}
.err{color:var(--bad);font-size:.8rem}
.chk-line{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink)}
.add-toggle{margin:0 18px 16px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px;color:var(--muted);font-size:.88rem;width:calc(100% - 36px)}
.add-toggle:hover{border-color:var(--accent);color:var(--accent)}

/* ---- 目标 ---- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);grid-template-areas:"month month" "day week";gap:18px;align-items:start}
.sheet.lv-month{flex-direction:row}
.lv-month>.sheet-head{width:240px;flex:none;border-bottom:0;border-right:1px solid var(--line)}
.lv-month>.sheet-body{flex:1;min-width:0;display:flex;flex-direction:column}
.lv-month ul.items{display:block;columns:3;column-gap:18px}
.lv-month ul.items>li{break-inside:avoid;margin-bottom:2px}
.lv-day{grid-area:day}.lv-week{grid-area:week}.lv-month{grid-area:month}
.lv-week ul.items{display:block;columns:2;column-gap:18px}
.lv-week ul.items>li{break-inside:avoid;margin-bottom:2px}
@media (max-width:1100px){.lv-month ul.items{columns:2}}
@media (max-width:900px){.grid{grid-template-columns:1fr;grid-template-areas:"month" "day" "week"}.lv-week ul.items,.lv-month ul.items{columns:1}.sheet.lv-month{flex-direction:column}.lv-month>.sheet-head{width:auto;border-right:0;border-bottom:1px solid var(--line)}}
.done-toggle{align-self:flex-start;margin:0 14px 6px;border:0;background:transparent;color:var(--muted);font-size:.8rem;padding:2px 0}
.done-toggle:hover{color:var(--ink)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.sheet-head{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.label-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager{display:flex;gap:4px;align-items:center;flex:none}
.pg{border:1px solid var(--line);background:var(--sheet);border-radius:7px;min-width:28px;height:28px;padding:0 7px;font-size:.95rem;line-height:1;color:var(--ink)}
.pg:hover{border-color:var(--accent);color:var(--accent)}
.pg.now{font-size:.76rem;color:var(--accent);border-color:var(--accent)}
.lvl{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.lvl .wk-no{font-family:var(--f-mono);font-weight:500;font-size:.85rem;color:var(--muted);margin-left:8px;letter-spacing:.02em}
.prog{display:flex;align-items:center;gap:12px}
.pct{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums;min-width:3.2ch}
.bar{flex:1;height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.carry{margin:12px 14px 0;background:var(--bad-soft);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.carry-title{font-size:.8rem;font-weight:600;color:var(--bad);letter-spacing:.04em}
.carry-row{display:flex;align-items:center;gap:8px;font-size:.88rem;min-width:0}
.carry-row span.t{flex:1;min-width:0;overflow-wrap:anywhere}
.carry-row .from{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.carry-row button{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:6px;padding:1px 8px;font-size:.78rem;white-space:nowrap}
ul.items{list-style:none;margin:0;padding:8px 8px 4px;display:flex;flex-direction:column}
li.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:9px 8px;border-radius:8px}
li.item:hover{background:var(--paper)}
.chk{width:20px;height:20px;margin-top:1px;border:1.6px solid var(--muted);border-radius:6px;background:transparent;display:grid;place-items:center;padding:0;flex:none}
.chk svg{width:13px;height:13px;opacity:0}
.chk svg path{stroke:var(--sheet)}
.done>.chk,.chk.on{background:var(--ok);border-color:var(--ok)}
.done>.chk svg,.chk.on svg{opacity:1}
.ttl2{overflow-wrap:anywhere;white-space:pre-wrap}
li.done .ttl2{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 6px}
.chip{font-size:.72rem;border-radius:5px;padding:0 6px;line-height:1.6}
.chip.delay{background:var(--warn-soft);color:var(--warn)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.chip.when{color:var(--muted);font-family:var(--f-mono);padding:0}
.edit-in{width:100%;box-sizing:border-box;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;font:inherit;background:var(--sheet);color:var(--ink)}
form.add{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px dashed var(--line);margin-top:auto}
form.add{align-items:flex-end}
form.add textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font:inherit;font-size:.9rem;line-height:1.5;color:var(--ink);resize:none;overflow:hidden;box-sizing:border-box;display:block}
form.add button{border:0;background:var(--accent);color:var(--sheet);border-radius:8px;padding:0 14px;font-size:.9rem;font-weight:600;height:2.4rem;flex:none}
textarea.edit-in{resize:none;overflow:hidden;line-height:1.5;display:block}
.fld textarea.grow{resize:none;overflow:hidden}

/* ---- Learnings & Task ---- */
.c-rule{background:var(--accent-soft);color:var(--accent)}
.c-case{background:var(--mtg-soft);color:var(--mtg)}
.c-idea{background:var(--warn-soft);color:var(--warn)}
.c-doubt{background:var(--bad-soft);color:var(--bad)}
.c-none{background:var(--oth-soft);color:var(--oth)}
.chips button.c-rule,.chips button.c-case,.chips button.c-idea,.chips button.c-doubt{background:var(--paper)}
.chips button.c-rule.on{background:var(--accent-soft)}.chips button.c-case.on{background:var(--mtg-soft)}
.chips button.c-idea.on{background:var(--warn-soft)}.chips button.c-doubt.on{background:var(--bad-soft)}
.chips button.p-drh.on,.chips button.p-impact.on,.chips button.t-current.on,.chips button.t-optimize.on,.chips button.tm.on,.chips button.f.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.filters{padding:0 18px 10px;display:flex;flex-direction:column;gap:6px}
ul.notes{list-style:none;margin:0;padding:0 8px 6px;display:flex;flex-direction:column}
.nt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:11px 10px;border-top:1px solid var(--line)}
.nt:first-child{border-top:0}
.nt .lead{display:flex;align-items:center;gap:8px;min-width:4.8em}
.nt .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.nt .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.nt.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.nmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.78rem;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:5px;padding:0 6px;line-height:1.55;color:var(--ink)}
.tag.p-drh,.tag.p-impact{font-weight:600}
.tag.t-optimize{color:var(--warn);border-color:currentColor}
.tag.tm{font-family:var(--f-mono);font-size:.72rem}
.who{overflow-wrap:anywhere}
.nt .flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:.72rem;border:1px solid currentColor;border-radius:5px;padding:0 6px;line-height:1.5}
.flag.task{color:var(--accent)}
.flag.due{color:var(--muted)}
.flag.open{color:var(--bad)}
.flag.ok{color:var(--ok)}
.chip.due{color:var(--muted);border:1px solid var(--line)}
.chip.late{color:var(--bad);border:1px solid currentColor}
.chip.src{background:var(--accent-soft);color:var(--accent)}
.older{margin:0 14px 12px;background:var(--paper);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.older-title{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.older-row{display:flex;align-items:center;gap:8px;font-size:.88rem;min-width:0;flex-wrap:wrap}
.older-row .t{flex:1;min-width:10em;overflow-wrap:anywhere;white-space:pre-wrap}
.older-row .from{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.older-row .from.late{color:var(--bad)}
.older-row.parked{opacity:.75}
.older-row .t.lt,.older-row .t{flex:1;min-width:10em}
.older-row button.park{color:var(--muted)}
.filed-line{padding:0 18px 8px;font-size:.8rem;color:var(--muted)}
.filed-line a{color:var(--accent)}
.filed-line .linkish{font-size:.8rem}
.park-toggle{align-self:flex-start;border:0;background:transparent;color:var(--muted);font-size:.8rem;padding:2px 0;margin-top:2px}
.park-toggle:hover{color:var(--ink)}
.older-row button.res{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:1px 8px;font-size:.78rem;white-space:nowrap}
.form-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.form-title{font-weight:600;font-size:.92rem}
.linkish{border:0;background:transparent;color:var(--accent);font-size:.85rem;padding:0;text-decoration:underline;text-underline-offset:3px}
.chip-rows{display:flex;flex-direction:column;gap:6px}
.chip-rows input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 9px;font:inherit;font-size:.88rem;color:var(--ink);min-width:0}
.due-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.due-row input[type=date]{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 8px;font:inherit;font-size:.88rem;color:var(--ink)}
.due-row input[type=date]:disabled{opacity:.45}
ol.bulk-rows{list-style:decimal;margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:10px}
.brow{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--paper);border-radius:9px;position:relative}
.brow textarea{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:6px 9px;font:inherit;font-size:.9rem;line-height:1.5;color:var(--ink);width:100%;box-sizing:border-box;resize:none;overflow:hidden;display:block}
.bctl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.bctl select,.bctl input.mini{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:4px 6px;font:inherit;font-size:.82rem;color:var(--ink);min-width:0;max-width:100%}
.bctl input.mini{width:9em}
.bctl .chips button{padding:1px 9px;font-size:.78rem}
.bctl input[type=date]:disabled{opacity:.45}
.brow-acts{display:flex;gap:10px;align-items:center;align-self:flex-end}
.bsave{border:1px solid var(--accent);background:var(--sheet);color:var(--accent);border-radius:7px;padding:3px 12px;font-size:.8rem;font-weight:600}
.bsave:hover{background:var(--accent);color:var(--sheet)}
.bsave:disabled{opacity:.5;cursor:default}
.brow .rm{border:0;background:transparent;color:var(--muted);font-size:.78rem;padding:0}
.brow .rm:hover{color:var(--bad)}
#bulk-raw{min-height:6em}

/* ---- 页面切换 ---- */
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{padding:5px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;background:var(--sheet)}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.bk{background:transparent;border-style:dashed;font-size:.8rem;padding:4px 10px}
.bk-msg{font-size:.78rem;color:var(--muted);align-self:center}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.badge{background:var(--bad);color:var(--sheet);border-radius:99px;font-size:.7rem;padding:0 6px;line-height:1.5;font-variant-numeric:tabular-nums}
.view{display:flex;flex-direction:column;gap:22px}
.view[hidden]{display:none!important}
.flag.kb{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.answer{font-size:.84rem;color:var(--ok);white-space:pre-wrap;overflow-wrap:anywhere}
.ans-form{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.ans-form textarea{flex:1;min-width:12em;border:1px solid var(--accent);background:var(--sheet);border-radius:7px;padding:5px 8px;font:inherit;font-size:.88rem;color:var(--ink);resize:none;overflow:hidden;line-height:1.5}
.ans-form button{border-radius:7px;padding:5px 12px;font-size:.84rem;border:1px solid var(--line);background:var(--sheet)}
.ans-form .primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}

/* ---- 知识库 ---- */
.kb-ask{display:flex;gap:8px;align-items:flex-end;padding:0 18px 12px;flex-wrap:wrap}
.kb-ask textarea{flex:1;min-width:14em;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 12px;font:inherit;font-size:.95rem;line-height:1.5;color:var(--ink);resize:none;overflow:hidden;box-sizing:border-box}
.kb-ask button{border-radius:9px;padding:0 16px;height:2.6rem;font-size:.9rem;border:1px solid var(--line);background:var(--sheet)}
.kb-ask .primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:600}
.kb-ask button:disabled{opacity:.5;cursor:default}
.kb-answer{margin:0 18px 14px;padding:12px 14px;border-radius:9px;background:var(--accent-soft);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.kb-search{padding:0 18px 16px}
.kb-search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 12px;font:inherit;font-size:.9rem;color:var(--ink)}
.kb-sort{border-style:dashed}
.sec-title.small{font-size:1.1rem}
.kb-sort .acts{display:flex;gap:8px;flex-wrap:wrap}
.pad{padding:0 18px 14px}
.pend-list{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:2px}
.pm-row{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;padding:6px 4px;flex-wrap:wrap;white-space:pre-wrap;overflow-wrap:anywhere}
.pm-row .t{flex:1;min-width:12em}
.pm-row .from{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
ol.draft-list{margin:0;padding:0 18px 16px 2.4em;display:flex;flex-direction:column;gap:12px}
.draft{background:var(--paper);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.draft.off{opacity:.5}
.draft>*{max-width:100%}
.draft-hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.draft-edit{display:flex;flex-direction:column;gap:6px;width:100%}
.draft-edit select,.draft-edit textarea{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:5px 8px;font:inherit;font-size:.88rem;color:var(--ink);box-sizing:border-box;max-width:100%}
.draft-edit textarea{width:100%;resize:none;overflow:hidden;line-height:1.5}
.draft-edit .btn{align-self:flex-start}
.draft-src{border-top:1px dashed var(--line);padding-top:6px;width:100%}
.kb-label{font-size:.74rem;color:var(--muted);letter-spacing:.04em;margin-right:6px}
.kb-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.kb-layout{grid-template-columns:1fr}}
.kb-dir{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:820px){.kb-dir{position:static}}
.dir-grp{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:8px}
.dir-row{display:flex;align-items:center;gap:4px}
.dir-row .dir-item{flex:1}
.dir-item,.dir-prog{display:flex;justify-content:space-between;gap:8px;align-items:center;border:0;background:transparent;border-radius:7px;padding:5px 8px;text-align:left;font-size:.86rem;width:100%}
.dir-prog{font-weight:600;font-size:.84rem}
.dir-item{padding-left:16px}
.dir-item:first-child{padding-left:8px}
.dir-item:hover,.dir-prog:hover{background:var(--paper)}
.dir-item.on,.dir-prog.on{background:var(--accent-soft);color:var(--accent)}
.dir-item .n,.dir-prog .n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.dir-row .rm{border:0;background:transparent;color:var(--bad);font-size:.74rem}
.dir-add{display:flex;gap:4px;padding:4px 0 0 16px}
.dir-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px;font:inherit;font-size:.82rem;color:var(--ink)}
.dir-add button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;font-size:.78rem;padding:0 8px}
.kb-dir .linkish{align-self:flex-start;margin-left:8px}
.kb-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.kb-crumb{font-size:.82rem;color:var(--muted)}
.kb-item{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kb-item.form{display:grid}
.kb-item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.kb-item-top>div:first-child{display:flex;flex-direction:column;gap:5px;min-width:0}
.kb-item:hover .row-acts{opacity:1}
.kb-title{font-family:var(--f-display);font-size:1.08rem;font-weight:700;margin:0;overflow-wrap:anywhere}
.kb-title.sm{font-size:.98rem}
.kb-title-btn{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.kb-title-btn:hover{color:var(--accent)}
.kb-summary.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb-more{align-self:flex-start;font-size:.8rem}
.kb-orig{display:flex;flex-direction:column;gap:6px}
.orig-row{background:var(--paper);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.orig-text{font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.kb-summary{margin:0;font-weight:600;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.kb-detail{font-size:.88rem;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;border-left:2px solid var(--line);padding-left:10px}
.kb-cases ul{margin:4px 0 0;padding-left:1.2em;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.kb-src{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.src-chip{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;line-height:1.6}
.kb-hist summary{font-size:.8rem;color:var(--muted);cursor:pointer}
.hist-row{border-left:2px dashed var(--line);padding:4px 0 4px 10px;margin-top:6px;font-size:.86rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.kb-pmatch{background:var(--paper);border-radius:9px;padding:10px 12px}
li.item>.row-acts,.nt>.row-acts{flex-direction:column;align-items:stretch;gap:1px;grid-row:span 2}
li.item>.row-acts button,.nt>.row-acts button{padding:1px 6px;font-size:.74rem;line-height:1.5;text-align:right}
li.item{column-gap:8px}
textarea[data-grow]{field-sizing:content;min-height:2.4em;overflow:hidden}
.lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lt-title{font-weight:600;overflow-wrap:anywhere}
.lt-row{display:flex;gap:6px;align-items:flex-start;min-width:0}
.lt-rest{flex:1;min-width:0;color:var(--muted);font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:400;text-decoration:none}
.lt-rest.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.lt-toggle{flex:none;border:0;background:transparent;color:var(--accent);font-size:.78rem;padding:0 2px;line-height:1.6;text-decoration:underline;text-underline-offset:3px}
li.done .ttl2 .lt-title,.nt.done .txt .lt-title{color:var(--muted);text-decoration:line-through}
.rt-mgr{padding:4px 14px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rt-mgr .linkish{font-size:.8rem}
.rt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;width:100%}
.rt-list li{display:flex;gap:6px;align-items:center;font-size:.86rem;background:var(--paper);border-radius:7px;padding:5px 8px}
.rt-list .t{flex:1;min-width:0;overflow-wrap:anywhere}
.rt-days{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:0 8px;font-size:.74rem;white-space:nowrap}
.rt-list .rm{border:0;background:transparent;color:var(--muted);font-size:.74rem;white-space:nowrap}
.rt-list .rm.sure{color:var(--bad);font-weight:600}
form.rt-add{padding:0;border:0;width:100%;margin:0}
.rep-row{display:flex;gap:6px 20px;flex-wrap:wrap}
.tsel{position:relative;display:flex;flex-direction:column}
.tsel input{width:100%;box-sizing:border-box;font-family:var(--f-mono)}
.tpop{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:7em;max-height:210px;overflow-y:auto;background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:20;padding:4px;display:flex;flex-direction:column}
.tpop[hidden]{display:none}
.topt{border:0;background:transparent;text-align:left;padding:5px 10px;border-radius:6px;font-family:var(--f-mono);font-size:.88rem;color:var(--ink)}
.topt:hover{background:var(--paper)}
.topt.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* ---- Tasks ---- */
.tk-list{display:flex;flex-direction:column;gap:12px;padding:0 14px 12px}
.tk{border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tk.archived{opacity:.7}
.tk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-fold{border:0;background:transparent;color:var(--muted);width:22px;padding:0;font-size:.9rem}
.tk-title{flex:1;min-width:12em;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font:inherit;font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--ink)}
.tk-title:hover,.tk-title:focus{border-color:var(--line);background:var(--paper)}
.tk-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tk-due{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 6px;font:inherit;font-size:.8rem;color:var(--ink)}
.tk-acts{display:flex;gap:10px;margin-left:auto}
.tk-acts .linkish{font-size:.8rem}
.tk-acts .danger{color:var(--bad);font-weight:600}
.tk-bar{height:5px;flex:none}
ol.tk-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tk-item{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:8px;align-items:start;padding:4px 2px;border-radius:7px}
.tk-item:hover{background:var(--paper)}
.tk-no{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);text-align:right;padding-top:5px}
.tk-item .chk{margin-top:4px}
.tk-text{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;font:inherit;font-size:.92rem;line-height:1.55;color:var(--ink);resize:none;overflow:hidden;width:100%;box-sizing:border-box;display:block}
.tk-text:hover,.tk-text:focus{border-color:var(--line);background:var(--sheet)}
.tk-item.done .tk-text{color:var(--muted);text-decoration:line-through}
.tk-iacts{display:flex;gap:2px;opacity:.45;padding-top:3px}
.tk-item:hover .tk-iacts,.tk-item:focus-within .tk-iacts{opacity:1}
.tk-iacts button{border:0;background:transparent;color:var(--muted);font-size:.76rem;padding:1px 5px;border-radius:5px}
.tk-iacts button:hover{background:var(--line);color:var(--ink)}
form.tk-add{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:8px;align-items:start;padding:0 2px}
form.tk-add textarea{border:1px dashed var(--line);background:var(--paper);border-radius:7px;padding:5px 8px;font:inherit;font-size:.9rem;line-height:1.5;color:var(--ink);resize:none;overflow:hidden;width:100%;box-sizing:border-box}
.tk-body{min-width:0}
.tk-files{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 6px 2px}
.tk-file{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:2px 4px 2px 9px;font-size:.8rem}
.tk-file a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:22em}
.tk-file a:hover{text-decoration:underline}
.tk-file .ftype{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);letter-spacing:.02em}
.tk-file .fx{border:0;background:transparent;color:var(--muted);font-size:.75rem;padding:0 5px;border-radius:999px}
.tk-file .fx:hover{background:var(--line);color:var(--ink)}
.tk-file .fx.danger{color:var(--bad);font-weight:600}
.tk-file .fx.pv{color:var(--accent);font-size:.72rem}
.tk-file .fnote{font-size:.72rem;color:var(--muted);padding-right:6px}
.tk-file .fnote.err{color:var(--bad)}
.tk-file img{width:22px;height:22px;object-fit:cover;border-radius:4px}
.tk-fadd{display:inline-flex;gap:2px;opacity:.4}
.tk-item:hover .tk-fadd,.tk-item:focus-within .tk-fadd,form.tk-add .tk-fadd{opacity:1}
.tk-fadd button{border:0;background:transparent;color:var(--muted);font-size:.76rem;padding:1px 6px;border-radius:5px}
.tk-fadd button:hover{background:var(--line);color:var(--ink)}
.tk-fadd .tk-mv:disabled{display:none}
.tk-fadd .tk-del{margin-left:6px}.tk-fadd .tk-del.danger{color:var(--bad);font-weight:600}
.tk-fadd .tk-mv:first-of-type{margin-left:6px}
.tk-link{display:flex;gap:6px;flex-wrap:wrap;padding:2px 6px;width:100%}
.tk-link input{flex:1;min-width:10em;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font:inherit;font-size:.82rem;color:var(--ink)}
.tk-fmsg{font-size:.78rem;color:var(--muted);padding:2px 6px}
.tk-fmsg.err{color:var(--bad)}
.tk-item.drop,form.tk-add.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.vw-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.vw-box{background:var(--sheet);color:var(--ink);border-radius:12px;width:min(1100px,100%);height:min(88vh,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.vw-head{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.vw-name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-body{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;min-height:0}
.vw-body.flush{padding:0}
.vw-frame{flex:1;width:100%;border:0}
.vw-img{max-width:100%;margin:auto}
.vw-doc{max-width:46em;line-height:1.7;font-size:.95rem}
.vw-doc table{border-collapse:collapse}.vw-doc td,.vw-doc th{border:1px solid var(--line);padding:4px 8px}
.vw-doc img{max-width:100%}
.vw-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.vw-tab{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 10px;font-size:.82rem}
.vw-tab.on{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.vw-scroll{overflow:auto;flex:1;min-height:0}
.vw-table{border-collapse:collapse;font-size:.84rem}
.vw-table th,.vw-table td{border:1px solid var(--line);padding:4px 8px;white-space:pre-wrap;vertical-align:top;max-width:28em}
.vw-table th{background:var(--paper);position:sticky;top:0;text-align:left}
.vw-pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.84rem;margin:0}
.tk-grip{cursor:grab;user-select:none;touch-action:none;white-space:nowrap}
.tk-grip .grip{opacity:.35;margin-right:3px;font-size:.95rem;transition:opacity .15s}
.tk-item:hover .tk-grip .grip,.tk-item:focus-within .tk-grip .grip{opacity:.7}
body.tk-dragging,body.tk-dragging *{cursor:grabbing!important;user-select:none}
.tk-item.dragging{opacity:.45;background:var(--paper)}
.tk-item.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.tk-item.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.tk-bg{background:var(--accent-soft);border-radius:8px;padding:8px 10px 6px;display:flex;flex-direction:column;gap:2px}
.tk-bg.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.tk-bg-label{font-size:.74rem;font-weight:600;color:var(--accent);letter-spacing:.06em;padding:0 6px}
.tk-bg-text{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;font:inherit;font-size:.92rem;line-height:1.6;color:var(--ink);resize:none;overflow:hidden;width:100%;box-sizing:border-box;display:block}
.tk-bg-text:hover,.tk-bg-text:focus{border-color:var(--line);background:var(--sheet)}
.tk-bg .tk-fadd{opacity:.55}.tk-bg:hover .tk-fadd,.tk-bg:focus-within .tk-fadd{opacity:1}
.ag-topic{grid-column:1/-1;margin-top:8px}
.tk.embedded{background:var(--paper);border-color:transparent}
.tk.embedded .tk-item:hover{background:var(--sheet)}
.tk.embedded .tk-top{min-height:0}
.tp-toggle{align-self:flex-start;border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:1px 10px;font-size:.78rem;color:var(--accent);margin-top:3px}
.tp-toggle:hover,.tp-toggle.on{border-color:var(--accent)}
.tp-toggle.on{background:var(--accent-soft)}
.tp-toggle.add{color:var(--muted);border-style:dashed}
.tp-toggle.add:hover{color:var(--accent)}
.loose-topic{margin:4px 18px 12px;display:flex;flex-direction:column;gap:6px}
.loose-hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loose-sel{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:2px 6px;font:inherit;font-size:.8rem;color:var(--ink)}
.tp-row{display:flex;gap:6px;flex-wrap:wrap}
.tp-toggle.hist{color:var(--muted)}
.tp-toggle.hist.on{color:var(--ink);background:var(--paper);border-color:var(--muted)}
.ag-hist{grid-column:1/-1;margin-top:8px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.hist-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hist-label{font-size:.76rem;font-weight:600;color:var(--muted);letter-spacing:.05em}
.hist-pick{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:2px 6px;font:inherit;font-size:.8rem;color:var(--ink)}
.hist-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.hist-chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 10px;text-align:left;max-width:15em}
.hist-chip:hover{border-color:var(--accent)}
.hist-chip.on{border-color:var(--accent);background:var(--accent-soft)}
.hist-chip .hd{font-family:var(--f-mono);font-size:.8rem;font-weight:500}
.hist-chip .hn{font-size:.72rem;color:var(--muted)}
.hist-chip .hp{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hist-card{display:flex;flex-direction:column;gap:4px}
.rep-sel{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:0 6px;height:2.4rem;font:inherit;font-size:.8rem;color:var(--muted);max-width:7.5em}
.rep-sel.sm{height:1.9rem;font-size:.78rem}
.edit-box{display:flex;flex-direction:column;gap:6px;min-width:0}
.edit-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edit-row .hint{font-size:.74rem}
.rep-sel.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}

form.quick-add{border-top:0;padding:0 18px 12px;margin:0}
ul.quick-list{list-style:none;margin:0;padding:0 10px 8px;display:flex;flex-direction:column}

.qside{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.qtag{font-size:.74rem;border-radius:5px;padding:0 7px;line-height:1.6;white-space:nowrap}
.q-goal{background:var(--accent-soft);color:var(--accent)}.q-kb{background:var(--mtg-soft);color:var(--mtg)}
.q-idea{background:var(--warn-soft);color:var(--warn)}.q-doubt{background:var(--bad-soft);color:var(--bad)}.q-none{background:var(--oth-soft);color:var(--oth)}
.qside .from{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.qacts{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;opacity:.55}
.qrow:hover .qacts,.qrow:focus-within .qacts{opacity:1}
.qacts button{border:0;background:transparent;color:var(--muted);font-size:.76rem;padding:1px 6px;border-radius:5px;white-space:nowrap}

.qans{border:1px solid var(--accent);background:var(--sheet);border-radius:6px;padding:1px 6px;font:inherit;font-size:.8rem;color:var(--ink);width:10em}
.tk-out{margin:4px 0 2px;border-left:2px solid var(--accent);padding-left:6px}
.tk-out-label{font-size:.72rem;font-weight:600;color:var(--accent);letter-spacing:.05em;padding:0 6px}
.tk-out textarea{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;font:inherit;font-size:.88rem;line-height:1.55;color:var(--ink);resize:none;overflow:hidden;width:100%;box-sizing:border-box;display:block}
.tk-out textarea:hover,.tk-out textarea:focus{border-color:var(--line);background:var(--sheet)}
.tk-out .tk-fmsg{padding:0 6px}
form.tk-new{display:flex;gap:8px;flex-wrap:wrap;padding:4px 14px 16px;border-top:1px dashed var(--line);margin-top:4px;padding-top:12px}
form.tk-new input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font:inherit;font-size:.9rem;color:var(--ink)}
form.tk-new input:first-child{flex:1;min-width:14em}
form.tk-new button{border:0;background:var(--accent);color:var(--sheet);border-radius:8px;padding:0 14px;font-weight:600;font-size:.9rem}
#tasks .done-toggle{margin:0 18px 10px}
.foot{color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

<script>
// 数据层（公开网页版）
// · 默认「本机模式」：数据存在这个浏览器里（localStorage），附件存在 IndexedDB。
// · 「同步模式」：连接你自己的 Google 表格（Apps Script 数据接口 + 密钥），数据和附件存进你的表格 / 云端硬盘，
//   换电脑、换浏览器打开同一个网址，连上就能看到。本机数据在同步模式下原样保留，断开后回到本机数据。
(function(){
  const NS='sophias-desk:';const RNS='sophias-desk-remote:';const COLLS=['goals','events','notes','tasks','kb_items','kbmeta'];
  const CFG_KEY='sophias-desk-sync';
  const cfg=(()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){return null}})();
  const REMOTE=!!(cfg&&cfg.url&&cfg.key);
  const P=REMOTE?RNS:NS;
  const data={},subs={};
  const clone=o=>JSON.parse(JSON.stringify(o===undefined?{}:o));
  const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const readColl=(c,pre)=>{try{return JSON.parse(localStorage.getItem((pre||P)+c)||'{}')||{}}catch(e){return {}}};
  for(const c of COLLS)data[c]=readColl(c);
  const notice=t=>{const n=document.getElementById('notice');if(n){n.hidden=!t;n.textContent=t||''}};
  let warned=false;
  function persist(c){try{localStorage.setItem(P+c,JSON.stringify(data[c]||{}))}catch(e){if(!warned){warned=true;notice('浏览器存储空间不够了，新内容可能没保存。请先「导出备份」，再删除一些旧记录。')}}}
  const snap=c=>({docs:Object.entries(data[c]||{}).map(([id,d])=>({id,data:()=>clone(d)}))});
  const notify=c=>{(subs[c]||[]).forEach(fn=>{try{fn(snap(c))}catch(e){console.error(e)}})};
  window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith(P)){const c=e.key.slice(P.length);if(COLLS.includes(c)){data[c]=readColl(c);notify(c)}}});

  /* ---------- Google 数据接口 ---------- */
  async function api(url,key,action,args){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key,action,args:args||[]})});
    let j;try{j=await r.json()}catch(e){throw new Error('接口没有返回数据，请检查网址是否是「任何人」可访问的部署')}
    if(!j.ok)throw new Error(j.error||'接口出错');return j.result;
  }
  const call=(a,...args)=>api(cfg.url,cfg.key,a,args);
  // 待上传的改动先存进「发件箱」，网络断了也不会丢，恢复后自动补传
  const OUT=RNS+'outbox';
  let outbox=(()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]')}catch(e){return []}})();
  const saveOut=()=>{try{localStorage.setItem(OUT,JSON.stringify(outbox))}catch(e){}};
  let flushing=false,stamp='',syncErr='';
  async function flush(){
    if(!REMOTE||flushing||!outbox.length)return;flushing=true;
    try{while(outbox.length){const batch=outbox.slice(0,20);stamp=await call('write',batch);outbox.splice(0,batch.length);saveOut()}syncErr='';setBadge()}
    catch(e){syncErr=String(e.message||e);setBadge()}
    finally{flushing=false}
  }
  async function pull(){
    const r=await call('listAll');stamp=r.stamp;
    // 还没传上去的本地改动，叠加在拉下来的数据上，避免被覆盖
    for(const c of COLLS){data[c]={};for(const d of r.collections[c]||[])data[c][d.id]=d.data}
    for(const o of outbox){const c=data[o.coll]=data[o.coll]||{};if(o.op==='delete')delete c[o.id];else if(o.op==='update')c[o.id]=Object.assign(c[o.id]||{},o.data);else c[o.id]=o.data}
    for(const c of COLLS){persist(c);notify(c)}
  }
  function enqueue(op){if(!REMOTE)return;outbox.push(op);saveOut();setBadge();setTimeout(flush,50)}
  if(REMOTE){
    const boot=async()=>{try{await flush();await pull();syncErr=''}catch(e){syncErr=String(e.message||e)}setBadge()};
    setTimeout(boot,0);
    setInterval(async()=>{if(document.hidden)return;try{await flush();if(!outbox.length){const s=await call('stamp');if(s!==stamp)await pull()}syncErr=''}catch(e){syncErr=String(e.message||e)}setBadge()},20000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)flush().then(()=>call('stamp')).then(s=>{if(s!==stamp&&!outbox.length)return pull()}).catch(()=>{})});
    window.addEventListener('online',flush);
  }

  function ref(c,id){return {id,
    async set(d){(data[c]=data[c]||{})[id]=clone(d);persist(c);setTimeout(()=>notify(c));enqueue({op:'set',coll:c,id,data:clone(d)})},
    async update(p){data[c]=data[c]||{};data[c][id]=Object.assign(data[c][id]||{},clone(p));persist(c);setTimeout(()=>notify(c));enqueue({op:'update',coll:c,id,data:clone(p)})},
    async delete(){if(data[c])delete data[c][id];persist(c);setTimeout(()=>notify(c));enqueue({op:'delete',coll:c,id})}}}
  const db={
    collection(c){return {
      onSnapshot(fn){(subs[c]=subs[c]||[]).push(fn);setTimeout(()=>fn(snap(c)));return()=>{subs[c]=subs[c].filter(x=>x!==fn)}},
      doc(id){return ref(c,id||gid())},
      async add(d){const r=ref(c,gid());await r.set(d);return r}}},
    doc(path){const [c,id]=path.split('/');return ref(c,id)}
  };

  /* ---------- 附件：本机用 IndexedDB，同步模式存云端硬盘 ---------- */
  let idbp=null;
  function idb(){if(!idbp)idbp=new Promise((res,rej)=>{const r=indexedDB.open('sophias-desk-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return idbp}
  async function tx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('files',mode);const st=t.objectStore('files');let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
  const putFile=(name,type,blob)=>{const id='f'+gid();return tx('readwrite',st=>st.put({id,name,type,blob})).then(()=>id)};
  const getFile=async id=>{const r=await tx('readonly',st=>st.get(id));if(!r)throw new Error('找不到这个附件');return r};
  async function b64(blob){const u=new Uint8Array(await blob.arrayBuffer());let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
  function fromB64(b){const s=atob(String(b).trim());const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
  function saveAs(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
  const isLocalId=id=>/^f[0-9a-z]+$/.test(id||'')&&String(id).length<=22;
  const assets={
    async upload(blob,o){const type=(o&&o.type)||blob.type||'application/octet-stream';
      const id=REMOTE?await call('uploadB64',blob.name||'file',type,await b64(blob)):await putFile(blob.name||'file',type,blob);
      return {id,url:'#',sizeBytes:blob.size,contentType:type}},
    async delete(id){if(REMOTE&&!isLocalId(id))await call('trashFile',id);else await tx('readwrite',st=>st.delete(id));return {deleted:true}},
    async list(){return {assets:[],usage:{}}}
  };
  window.__DESK={kind:REMOTE?'sync':'local',
    openHint:REMOTE?'点击在 Google 云端硬盘打开原文件':'点击打开原文件（下载后用 Excel / Word / PPT 打开）',
    async openFile(id,name){
      if(REMOTE&&!isLocalId(id)){window.open('https://drive.google.com/file/d/'+id+'/view','_blank','noopener');return}
      const f=await getFile(id);const blob=new Blob([f.blob],{type:f.type});
      if(/^(application\/pdf|image\/|video\/|text\/)/.test(f.type))window.open(URL.createObjectURL(blob),'_blank','noopener');else saveAs(blob,name||f.name)},
    fileText:async id=>REMOTE&&!isLocalId(id)?call('fileText',id):(await getFile(id)).blob.text(),
    fileB64:async id=>REMOTE&&!isLocalId(id)?call('fileB64',id):b64((await getFile(id)).blob),
    uploadB64:(n,m,b)=>REMOTE?call('uploadB64',n,m,b):putFile(n,m,new Blob([fromB64(b)],{type:m})),
    uploadText:(n,t)=>REMOTE?call('uploadText',n,t):putFile(n,'application/json',new Blob([t],{type:'application/json'})),
    async saveBackup(n,j){saveAs(new Blob([j],{type:'application/json'}),n);return '已下载备份文件'},
    async importAll(cols){
      for(const c of COLLS){data[c]={};for(const d of cols[c]||[]){const x=Object.assign({},d);delete x.id;data[c][d.id]=x}persist(c);notify(c)}
      if(REMOTE){outbox=[];saveOut();await call('importAll',cols);stamp=await call('stamp')}
    }
  };
  window.claude={use:async n=>n==='db'?db:n==='assets'?assets:n==='user'?{can:async()=>true,isOwner:()=>true}:null};

  /* ---------- 同步设置（页面上的「同步」按钮和设置窗口） ---------- */
  function setBadge(){const b=document.getElementById('sync-btn');if(!b)return;
    if(!REMOTE){b.textContent='同步：本机';b.title='数据只存在这个浏览器里。点这里连接你的 Google 表格';return}
    b.textContent=syncErr?'同步出错':outbox.length?'同步中…':'已同步 Google 表格';b.classList.toggle('err',!!syncErr);b.title=syncErr||'数据同步到你的 Google 表格'}
  const localHasData=()=>COLLS.some(c=>Object.keys(readColl(c,NS)).length);
  // 把本机数据（含附件）整体搬到表格
  async function migrate(url,key,say){
    const cols={};for(const c of COLLS)cols[c]=Object.entries(readColl(c,NS)).map(([id,d])=>Object.assign({id},d));
    const map={};let n=0;
    for(const t of cols.tasks){for(const f of [...(t.bgFiles||[]),...(t.items||[]).flatMap(i=>i.files||[])]){
      for(const k of ['oid','aid']){const old=f[k];if(!old||!isLocalId(old))continue;
        if(!map[old]){try{const r=await getFile(old);map[old]=await api(url,key,'uploadB64',[r.name,r.type,await b64(r.blob)]);n++;say('正在上传附件 '+n+'…')}catch(e){}}
        if(map[old])f[k]=map[old]}}}
    say('正在上传数据…');await api(url,key,'importAll',[cols]);return n;
  }
  function openDialog(){
    const ov=document.createElement('div');ov.className='vw-overlay';
    const box=document.createElement('div');box.className='vw-box sync-box';box.setAttribute('role','dialog');box.setAttribute('aria-label','同步设置');
    const close=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)close()};
    if(REMOTE){
      box.innerHTML='<div class="vw-head"><div class="vw-name">同步设置</div></div><div class="vw-body"><p>现在数据同步在你的 Google 表格里。</p><p class="hint">接口网址：<code></code></p><p class="hint">断开后回到这个浏览器里原来的本机数据，表格里的数据不会删除。</p><div class="sync-acts"><button type="button" class="btn" data-a="cancel">关闭</button><button type="button" class="btn" data-a="off">断开同步</button></div></div>';
      box.querySelector('code').textContent=cfg.url;
      box.querySelector('[data-a=off]').onclick=()=>{localStorage.removeItem(CFG_KEY);for(const c of COLLS)localStorage.removeItem(RNS+c);location.reload()};
    }else{
      box.innerHTML='<div class="vw-head"><div class="vw-name">连接 Google 表格</div></div><div class="vw-body"><p>连接后，数据和附件存进你自己的 Google 表格 / 云端硬盘；换电脑、换浏览器打开这个网址，再连一次就能看到同样的数据。</p><label class="fld">数据接口网址（以 /exec 结尾）<input id="sync-url" placeholder="https://script.google.com/macros/s/…/exec"></label><label class="fld">密钥<input id="sync-key" placeholder="运行 makeApiKey 得到的密钥"></label><div class="sync-q" hidden><p></p><label class="chk-line"><input type="radio" name="sync-mode" value="sheet" checked> 用表格里的数据（这个浏览器里的本机数据原样保留）</label><label class="chk-line"><input type="radio" name="sync-mode" value="upload"> 用这个浏览器里的数据覆盖表格</label></div><p class="hint sync-msg" role="status"></p><div class="sync-acts"><button type="button" class="btn" data-a="cancel">取消</button><button type="button" class="btn primary" data-a="go">连接</button></div></div>';
      const say=t=>{box.querySelector('.sync-msg').textContent=t};
      let checked=null;
      box.querySelector('[data-a=go]').onclick=async()=>{
        const url=box.querySelector('#sync-url').value.trim(),key=box.querySelector('#sync-key').value.trim();
        if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){say('网址不对：应该以 https://script.google.com/ 开头、/exec 结尾');return}
        if(!key){say('请填写密钥');return}
        try{
          if(!checked){say('正在连接…');const r=await api(url,key,'listAll',[]);const remoteN=COLLS.reduce((s,c)=>s+(r.collections[c]||[]).length,0);
            checked={remoteN};
            if(!remoteN&&localHasData()){say('表格是空的，正在把这个浏览器里的数据上传…');const n=await migrate(url,key,say);say('已上传，共 '+n+' 个附件');}
            else if(remoteN&&localHasData()){const q=box.querySelector('.sync-q');q.hidden=false;q.querySelector('p').textContent='表格里已经有 '+remoteN+' 条记录，这个浏览器里也有数据。选一个：';say('选好后再点一次「连接」');return}
          }else if(box.querySelector('input[name=sync-mode]:checked').value==='upload'){say('正在上传…');await migrate(url,key,say)}
          localStorage.setItem(CFG_KEY,JSON.stringify({url,key,at:Date.now()}));say('连接成功，正在刷新…');setTimeout(()=>location.reload(),400);
        }catch(e){checked=null;say('连接没成功：'+(e.message||e))}
      };
    }
    box.querySelector('[data-a=cancel]').onclick=close;
    ov.append(box);document.body.append(ov);
  }
  function mount(){
    const tabs=document.querySelector('.tabs');if(!tabs||document.getElementById('sync-btn'))return;
    const b=document.createElement('button');b.type='button';b.id='sync-btn';b.className='tab bk sync';b.onclick=openDialog;tabs.append(b);setBadge();
    const st=document.createElement('style');st.textContent='.sync-box{height:auto;max-height:90vh;width:min(560px,100%)}.sync-box .vw-body{gap:10px}.sync-box p{margin:0}.sync-box .fld input{width:100%;box-sizing:border-box}.sync-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}.tab.sync.err{color:var(--bad);border-color:var(--bad)}.sync-box code{word-break:break-all}';document.head.append(st);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else setTimeout(mount);
})();

</script>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Sophia's Desk</h1>
      <div class="sub">速记 · 日程与会议议题 · 月 / 周 / 日目标 · 知识库</div>
      <nav class="tabs" aria-label="切换页面">
        <a href="#desk" id="tab-desk" class="tab">工作台</a>
        <a href="#kb" id="tab-kb" class="tab">知识库<span id="kb-badge" class="badge" hidden></span></a>
        <button type="button" id="bk-export" class="tab bk">导出备份</button>
        <button type="button" id="bk-import" class="tab bk" hidden>导入备份</button>
        <span id="bk-msg" class="bk-msg" role="status"></span>
      </nav>
    </div>
    <div class="nav" id="desk-nav" aria-label="切换日期">
      <button class="btn" id="prev" type="button" aria-label="前一天">‹</button>
      <div class="date" id="cur-date">—</div>
      <button class="btn" id="next" type="button" aria-label="后一天">›</button>
      <button class="btn" id="today" type="button">今天</button>
      <input type="date" id="pick" aria-label="选择日期">
      <button class="btn primary" id="open-report" type="button">生成周报</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>
  <div id="desk" class="view">
  <section class="panel report" id="report" aria-label="周报" hidden></section>
  <section class="panel quick" id="quick" aria-label="速记"></section>
  <section class="panel" id="cal" aria-label="日程"></section>
  <div class="grid" id="grid"></div>
  <div class="foot">「顺延」会把目标移到下一个月 / 周 / 日并记录次数；之前没完成的目标、待办和存疑会显示在对应区域顶部。速记里的规则、个案、已采纳的想法、已确认的问题会进入知识库的「待整理」。</div>
  </div>
  <div id="kb" class="view" hidden></div>
</div>

<script>
(function(){
  // 独立部署时（Google 版 / 浏览器本地版）由外层提供 window.__DESK：文件读写、备份、导入
  const HOST=window.__DESK||null;const GMODE=!!HOST;
  async function blobText(id){return GMODE?HOST.fileText(id):(await fetch('/_blob/'+id)).text()}
  /* ---------- 日期工具 ---------- */
  const WD=['周日','周一','周二','周三','周四','周五','周六'];
  const pad=n=>String(n).padStart(2,'0');
  const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
  function weekKey(d){
    const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const wd=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-wd);
    const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);
    return y+'-W'+pad(w);
  }

  function moveTo(g,period){put('goals',g.id,{period,delays:(g.delays||0)+1,origin:g.origin||g.period,history:[...(g.history||[]),g.period],order:Date.now()})}
  /* 每日固定目标：模板存在 kbmeta/routines，勾选后才在 goals 里写一条当天记录 */
  // 固定（循环）目标：日（工作日 / 每天）、周（每周）、月（每月）
  let routines=[];const rtUI={open:{},text:{},confirm:null};const addRep={day:'',week:'',month:''};
  const rtLevel=r=>r.level||'day';
  const RT_OPTS={day:[['','不循环'],['weekdays','工作日固定'],['all','每天固定']],week:[['','不循环'],['weekly','每周固定'],['biweekly','每两周固定']],month:[['','不循环'],['monthly','每月固定']]};
  function rtLabel(r){const l=rtLevel(r);return l==='week'?(r.every===2?'每两周固定':'每周固定'):l==='month'?'每月固定':r.days==='all'?'每日固定':'工作日固定'}
  function routinesFor(key,level){
    level=level||'day';
    const wd=level==='day'?parseKey(key).getDay():0;
    return routines.filter(r=>rtLevel(r)===level&&(!r.since||key>=r.since)&&(!r.until||key<=r.until)&&(level!=='day'||r.days==='all'||(wd>=1&&wd<=5))&&!(r.skip||[]).includes(key)&&(level!=='week'||r.every!==2||!r.since||unitsBetween('week',r.since,key)%2===0)).map(r=>{
      const id='r-'+r.id+'-'+key;const doc=goals.find(g=>g.id===id);
      return Object.assign({id,level,period:key,title:r.title,status:'todo',routine:r.id,order:-1},doc||{},{title:r.title});
    });
  }
  async function toggleRoutine(g,key){
    const d=g.status==='done';
    try{await db.doc('goals/'+g.id).set({level:g.level||'day',period:key,title:g.title,status:d?'todo':'done',doneAt:d?null:Date.now(),routine:g.routine,order:-1,createdAt:g.createdAt||Date.now()})}catch(e){fail(e)}
  }
  async function skipRoutine(g){
    await saveRoutines(routines.map(x=>x.id===g.routine?Object.assign({},x,{skip:[...(x.skip||[]),g.period]}):x));
    if(goals.some(x=>x.id===g.id))await del('goals',g.id);
  }
  async function removeRoutine(rid){
    await saveRoutines(routines.filter(x=>x.id!==rid));
    for(const x of goals.filter(x=>x.routine===rid))await del('goals',x.id);
    for(const n of notes.filter(n=>n.routineId===rid))await put('notes',n.id,{routineId:''});
  }

  async function saveGoalEdit(g,L,rt,title,rep,curRep){
    if(!rt){
      if(!rep){if(title!==g.title)put('goals',g.id,{title});else render();return}
      await makeRoutine(Object.assign({},g,{title}),L,rep);return;
    }
    // 固定目标
    if(!rep){
      // 停止循环：从这一期起不再自动出现，这一期保留为普通目标，之前各期的记录不动
      const until=shiftKey(L.key,g.period,-1);
      await saveRoutines(routines.map(x=>x.id===rt.id?Object.assign({},x,{until,title}):x));
      try{await db.doc('goals/'+g.id).delete().catch(()=>{});await db.collection('goals').add({level:L.key,period:g.period,title,status:g.status==='done'?'done':'todo',doneAt:g.doneAt||null,delays:0,origin:g.period,history:[],order:Date.now(),createdAt:Date.now()})}catch(e){fail(e)}
      return;
    }
    const patch={};if(title!==rt.title)patch.title=title;if(L.key==='day'&&rep!==curRep)patch.days=rep;if(L.key==='week'&&rep!==curRep)patch.every=rep==='biweekly'?2:1;
    if(Object.keys(patch).length){
      await saveRoutines(routines.map(x=>x.id===rt.id?Object.assign({},x,patch):x));
      if(patch.title&&goals.some(x=>x.id===g.id))put('goals',g.id,{title});
    } else render();
  }
  // 把一条普通目标改成固定目标：从这一期开始循环，本期的完成状态保留
  async function makeRoutine(g,L,rep){

  }

  // 上传文档到某一项（itemId 为 null 时新建一项）
  async function tkAttach(t,itemId,fileList){
    const key=t.id+'/'+(itemId||'new');
    if(!assetsFn){tkUI.msg[key]={err:true,text:'当前视图不能上传文档（需要编辑权限）。'};render();return}
    const ok=[],bad=[],office=[];
    for(const f of fileList){const e=extOf(f.name);let ty=FTYPES[e];
      if(f.size>20*1048576){bad.push(f.name+'（超过 20 MB）');continue}
      if(/^(xlsx|xlsm|xls|docx|pptx)$/.test(e)){if(f.size>15*1048576){bad.push(f.name+'（Word / Excel / PPT 超过 15 MB）');continue}ok.push([f,'conv']);continue}
      if(!ty){(/^(doc|ppt|key|pages|numbers)$/.test(e)?office:bad).push(f.name);continue}
      ok.push([f,ty])}
    tkUI.busy[key]=(tkUI.busy[key]||0)+ok.length;tkUI.msg[key]=null;render();
    const added=[];const errs=[];
    for(const [f,ty] of ok){
      try{
        const rec={id:uid(),name:f.name,size:f.size,at:Date.now()};
        if(ty==='conv'){
          const e=extOf(f.name);
          // 原文件：存一份完整副本，点击文件名时下载并用 Excel / Word / PPT 打开
          if(GMODE){const o=await assetsFn.upload(f,{type:OFFICE_MIME[e]||'application/octet-stream'});rec.oid=o.id}
          else if(e!=='xls'&&e!=='xlsm'){const o=await assetsFn.upload(new Blob([await toB64(f)],{type:'text/plain'}),{type:'text/plain'});rec.oid=o.id}
          // 预览副本（PPT 没有预览）
          if(e!=='pptx'){try{const c=await convertOffice(f);const r=await assetsFn.upload(new Blob([JSON.stringify(c.data)],{type:'application/json'}),{type:'application/json'});rec.aid=r.id;rec.kind=c.kind}catch(x){if(!rec.oid)throw x}}
          else rec.kind='ppt';
        } else {const r=await assetsFn.upload(f,{type:ty});rec.aid=r.id}
        added.push(rec)}
      catch(err){errs.push(f.name+(err&&err.code==='too_large'?'（太大）':err&&err.code==='quota_or_state'?'（存储空间已满）':err&&err.conv?'（文件读不出来，可另存为 PDF 再加）':'（上传失败）'))}
      tkUI.busy[key]--;
    }
    if(added.length){
      const cur=tkCur(t);
      if(itemId==='__bg'){const tt=tasks.find(x=>x.id===t.id)||t;const bf=[...(tt.bgFiles||[]),...added];t.bgFiles=bf;tkSave(t,{bgFiles:bf})}
      else if(itemId&&cur.some(x=>x.id===itemId))tkSetItems(t,cur.map(x=>x.id===itemId?Object.assign({},x,{files:[...(x.files||[]),...added]}):x));
      else{const txt=(tkUI.draft[t.id]||'').trim()||added.map(a=>a.name.replace(/\.[^.]+$/,'')).join('、');tkUI.draft[t.id]='';tkSetItems(t,[...cur,{id:uid(),text:txt,done:false,files:added}])}
    }
    const m=[];
    if(office.length)m.push(office.join('、')+'：旧版 .doc / .ppt 暂不支持，请另存为 .docx / .pptx 或 PDF 再加，或用「＋ 链接」贴在线文档地址');
    if(bad.length)m.push(bad.join('、')+'：不支持这个格式（可传 Word .docx、Excel、PDF、图片、CSV、TXT）');
    if(errs.length)m.push(errs.join('、'));
    tkUI.msg[key]=m.length?{err:true,text:m.join('。')}:null;
    render();
  }
  // Word / Excel 在浏览器里转成可预览的副本（原文件留在你电脑上）
  const libs={};
  function loadLib(key,src,global){if(window[global])return Promise.resolve(window[global]);if(!libs[key])libs[key]=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=()=>window[global]?res(window[global]):rej(new Error('load'));sc.onerror=()=>{libs[key]=null;rej(new Error('load'))};document.head.append(sc)});return libs[key]}
  const XLSX_SRC='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',MAMMOTH_SRC='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
  async function convertOffice(f){
    const e=extOf(f.name);const buf=await f.arrayBuffer();
    try{
      if(e==='docx'){const m=await loadLib('m',MAMMOTH_SRC,'mammoth');const r=await m.convertToHtml({arrayBuffer:buf});return {kind:'doc',data:{v:1,html:r.value}}}
      const X=await loadLib('x',XLSX_SRC,'XLSX');const wb=X.read(buf,{type:'array',cellDates:true});
      const sheets=wb.SheetNames.map(n=>{const rows=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});return {name:n,rows:rows.slice(0,3000).map(r=>r.slice(0,80))}});
      return {kind:'sheet',data:{v:1,sheets}};
    }catch(err){const x=new Error('conv');x.conv=true;throw x}
  }
  function cleanHtml(html){
    const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
    const OK=/^(P|BR|B|STRONG|I|EM|U|S|SUB|SUP|H[1-6]|UL|OL|LI|TABLE|THEAD|TBODY|TR|TD|TH|A|IMG|SPAN|DIV|BLOCKQUOTE|PRE|CODE|HR)$/;
    const walk=n=>{for(const c of [...n.children]){if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|NOSCRIPT)$/.test(c.tagName)){c.remove();continue}if(!OK.test(c.tagName)){c.replaceWith(...c.childNodes);continue}
      for(const a of [...c.attributes]){const k=a.name.toLowerCase();const keep=(k==='href'&&/^https?:/i.test(a.value))||(k==='src'&&/^data:image\//i.test(a.value))||k==='colspan'||k==='rowspan'||k==='alt';if(!keep)c.removeAttribute(a.name)}
      if(c.tagName==='A'){c.target='_blank';c.rel='noopener'}walk(c)}};
    const root=doc.body.firstChild;walk(root);walk(root);return root;
  }

  function csvRows(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur=''}else cur+=ch}if(cur||row.length){row.push(cur);rows.push(row)}return rows}

  async function saveOutcome(t,itemId,v){
    const cur=tkCur(t);const me=cur.find(x=>x.id===itemId);if(!me)return;
    const routed=new Set(me.routed||[]);const newly=[];
    const dk=t.evDate||t.due||todayKey();
    for(const raw of v.split('\n')){
      const line=raw.replace(/^\s*(?:[-*•·]|\d{1,2}[.、)）])\s*/,'').trim();if(!line||routed.has(line))continue;
      const isRule=/^(规则|口径)\s*[:：]/.test(line);const isTodo=/^(待办|todo|to do|TODO|@)\s*[:：]?/i.test(line);const due=detectDue(line);const rr=!isRule?detectRepeat(line):null;
      if(!isRule&&!isTodo&&!due&&!rr)continue;
      if(rr){routed.add(line);newly.push(line);try{await addRoutineFrom(line.replace(/^(待办|todo|to do|@)\s*[:：]?\s*/i,''),rr)}catch(e){fail(e)}continue}
      routed.add(line);newly.push(line);
      try{
        if(isRule)await db.collection('notes').add({date:dk,cat:'rule',text:line.replace(/^(规则|口径)\s*[:：]\s*/,''),meeting:t.title||'',createdAt:Date.now(),done:false,goalId:'',fromTopic:t.id});
        else await addGoalFor('',line.replace(/^(待办|todo|to do|@)\s*[:：]?\s*/i,''),due);
      }catch(e){fail(e)}
    }
    const patch={outcome:v};if(newly.length)patch.routed=[...routed];
    if(v!==(me.outcome||'')||newly.length)tkSetItems(t,cur.map(x=>x.id===itemId?Object.assign({},x,patch):x));else render();
  }

  function tkDragStart(e,t,li){
    if(e.button!==0)return;e.preventDefault();
    const ol=li.parentElement;const lis=[...ol.querySelectorAll(':scope > li.tk-item')];
    const from=lis.indexOf(li);let to=from;
    li.classList.add('dragging');document.body.classList.add('tk-dragging');
    const clear=()=>lis.forEach(x=>x.classList.remove('drop-before','drop-after'));
    const move=ev=>{
      const y=ev.clientY;let idx=lis.length-1;
      for(let k=0;k<lis.length;k++){const r=lis[k].getBoundingClientRect();if(y<r.top+r.height/2){idx=k;break}}
      // idx = 放到第 idx 项之前（最后一项之后时 idx=len）
      const last=lis[lis.length-1].getBoundingClientRect();if(y>=last.top+last.height/2)idx=lis.length;
      to=idx>from?idx-1:idx;clear();
      if(to!==from){if(idx<lis.length)lis[idx].classList.add('drop-before');else lis[lis.length-1].classList.add('drop-after')}
      const vh=window.innerHeight;if(y<60)window.scrollBy(0,-12);else if(y>vh-60)window.scrollBy(0,12);
    };
    const up=()=>{
      document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      clear();li.classList.remove('dragging');document.body.classList.remove('tk-dragging');
      if(to===from)return;
      const cur=tkCur(t);const id=li.dataset.iid;const k=cur.findIndex(x=>x.id===id);if(k<0)return;
      const a=[...cur];const [m]=a.splice(k,1);a.splice(Math.min(to,a.length),0,m);tkSetItems(t,a);render();
    };
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  }

  // 从文字里识别截止日：10.15 / 10月15日 / 10/15 / 下周三 / 周五 / 明天 / 后天 / 14号
  function detectDue(text){
    const t=String(text||''); const now=new Date(); now.setHours(0,0,0,0);
    let m=t.match(/(\d{1,2})\s*(?:[.\/]|月)\s*(\d{1,2})\s*[日号]?/);
    if(m){const mo=+m[1],d=+m[2];if(mo>=1&&mo<=12&&d>=1&&d<=31){let dt=new Date(now.getFullYear(),mo-1,d);if(dt<now-60*864e5)dt=new Date(now.getFullYear()+1,mo-1,d);return dayKey(dt)}}
    m=t.match(/(下下|下|本|这)?(?:周|星期|礼拜)([一二三四五六日天])/);
    if(m){const idx={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7,'天':7}[m[2]];const off={'下下':14,'下':7}[m[1]]||0;const mon=mondayOf(now);mon.setDate(mon.getDate()+off+idx-1);return dayKey(mon)}
    if(/后天/.test(t)){const d=new Date(now);d.setDate(d.getDate()+2);return dayKey(d)}
    if(/明天/.test(t)){const d=new Date(now);d.setDate(d.getDate()+1);return dayKey(d)}
    if(/今天|今日/.test(t)&&/(前|之前|完成|截止|due)/i.test(t))return dayKey(now);
    m=t.match(/(\d{1,2})\s*[号日]/);

  // 截止今天或已过 → 今日任务；本周内 → 本周目标；下周 → 下周目标；更晚 → 当月目标
  function routeFor(due){
    const tw=weekKey(new Date());

    const dw=weekKey(parseKey(due));
    if(dw<=tw)return {level:'week',period:tw};
    if(dw===nextKey('week',tw))return {level:'week',period:dw};
    return {level:'month',period:due.slice(0,7)};
  }

  // 识别文字里的循环周期：每天 / 工作日 / 每周 / 每两周 / 每月
  function detectRepeat(text){
    const t=String(text||'');
    if(/(每两周|每隔一周|隔周|双周|每2周|两周一次)/.test(t))return {level:'week',rep:'biweekly'};
    if(/(每个?工作日|工作日每天)/.test(t))return {level:'day',rep:'weekdays'};
    if(/(每天|每日|天天)/.test(t))return {level:'day',rep:'all'};
    if(/(每周|每星期|每个星期|每礼拜|周周)/.test(t))return {level:'week',rep:'weekly'};
    if(/(每个?月|每月|月度固定)/.test(t))return {level:'month',rep:'monthly'};
    return null;
  }

  }

  /* 批量：粘贴会议记录 → 拆分 → 确认 → 保存 */
  /* 按用户自己的结构解析：
     - 标题行（以 ：/: 结尾的短行、【…】、# 开头）不是条目，而是给下面各条的分类提示
     - 用了编号（1. 1、 (1)）时，编号之间的多行算同一条；没用编号时一行一条
     - 用户写明的分类（标题或行首【规则】等）优先，Claude 只补用户没写的部分，绝不拆分或合并 */
  const HINTS=[
    [/规则|口径|结论|定了/,{cat:'rule'}],[/个案|案例|case/i,{cat:'case'}],[/想法|优化|建议|idea/i,{cat:'idea'}],
    [/待确认|存疑|疑问|问题|不确定/,{cat:'doubt'}],[/待办|to\s*do|todo|task|任务/i,{task:true}],
    [/demo\s*room|drh|host\s*program/i,{prog:'drh'}],[/impact|affiliate|联盟/i,{prog:'impact'}],
    [/现行/,{track:'current'}],[/待优化/,{track:'optimize'}]
  ];
  function hintsOf(t){
    const h={};for(const [re,v] of HINTS)if(re.test(t))Object.assign(h,v);
    const tm=TEAMS.filter(x=>new RegExp('(^|[^A-Za-z])'+x+'([^A-Za-z]|$)').test(t));if(tm.length)h.teams=tm;
    return h;
  }
  function isHeader(line){
    const t=line.trim();
    if(/^#+\s*\S/.test(t))return true;
    if(/^【[^】]{1,20}】$/.test(t))return true;
    if(/^[^，。；,;]{1,20}[：:]$/.test(t))return true;
    return false;
  }
  const NUM=/^\s*(?:\d{1,2}(?:\.(?!\d)|[、)）])|[（(]\d{1,2}[)）]|[一二三四五六七八九十]+[、.])\s*/;
  const BUL=/^\s*[-*•·]\s*/;
  function parseItems(raw){
    const lines=String(raw).split(/\n/);
    const numbered=lines.some(l=>NUM.test(l));
    const items=[];let ctx={};let cur=null;
    for(const line of lines){
      if(!line.trim()){if(!numbered)cur=null;continue}
      if(isHeader(line)){ctx=hintsOf(line.replace(/[#【】：:]/g,''));cur=null;continue}
      const isNew=numbered?NUM.test(line):true;
      let text=line.replace(NUM,'').replace(BUL,'').trim();
      // 行首自带标签，如【规则】xxx / [待办] xxx
      const tag=text.match(/^[【\[]([^】\]]{1,12})[】\]]\s*/);let own={};
      if(tag){own=hintsOf(tag[1]);text=text.slice(tag[0].length)}
      if(isNew||!cur){cur={text,hint:tag?own:Object.assign({},ctx)};items.push(cur)}
      else cur.text+='\n'+line.replace(BUL,'- ').trim();
    }
    return items.filter(i=>i.text.trim());
  }
  function rowFrom(o,hint){
    hint=hint||{};
    const text=String(o.text||'').trim();
    let due=typeof o.due==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.due)?o.due:'';
    if(!due)due=detectDue(text);
    const cat=hint.cat||normCat(o.cat);
    const prog=hint.prog||(PROGS.some(p=>p.k===o.prog)?o.prog:(PREFS.prog||''));
    const track=hint.track||(TRACKS.some(t=>t.k===o.track)?o.track:'');
    const teams=hint.teams||(Array.isArray(o.teams)?o.teams.map(String).filter(t=>TEAMS.includes(t)):[]);
    const task=hint.task?true:(o.task===true||(o.task===undefined&&!!due));
    return {text,cat,prog,track,teams,people:String(o.people||'').slice(0,80),task,due};
  }
  async function bulkSplit(useAI){
    const items=parseItems(bulk.raw);
    if(!items.length){bulk.err='先粘贴会议记录。';render();return}
    bulk.err='';
    const plain=()=>items.map(it=>rowFrom({text:it.text},it.hint));
    if(!useAI||!sampleFn){bulk.rows=plain();render();return}
    bulk.busy=true;bulk.ctl=new AbortController();render();
    const now=new Date();
    const prompt=[
      '你在帮一位 OMTech 员工给她已经整理好的会议记录打标签。她负责 Demo Room Host Program 和 Impact Affiliate 两块业务。',
      '今天是 '+dayKey(now)+'（'+WD[now.getDay()]+'），本周一是 '+dayKey(mondayOf(now))+'。',
      '下面的条目已经由她本人分好了，每个编号就是一条。严格保持条数和顺序：不要拆分、不要合并、不要改写，text 原样返回。',
      '如果条目后面的「已标注」里写了某个字段，就照抄，不要改。只补充没标注的字段：',
      '- cat：rule（已定下的规则、做法、口径）| case（某个具体 host 或客户的情况）| idea（可以优化、改进的想法）| doubt（拿不准、需要再确认）| ""（纯待办或无法判断）',
      '- prog：drh | impact | ""；track：current（现行业务）| optimize（待优化业务）| ""',
      '- teams：数组，只能取 "TS"、"MKT"、"OP"；people：涉及的人名，没有就 ""',
      '- task：是否是需要她去做的待办（true/false）；due：截止日 YYYY-MM-DD，没有明确日期就 ""',
      '只回复一个 JSON 数组，长度必须是 '+items.length+'，例如：[{"i":1,"text":"…","cat":"rule","prog":"drh","track":"current","teams":[],"people":"","task":false,"due":""}]',
      '','条目：',...items.map((it,i)=>(i+1)+'. '+it.text.replace(/\n/g,' / ')+(Object.keys(it.hint).length?'　（已标注：'+JSON.stringify(it.hint)+'）':''))
    ].join('\n');
    try{
      const out=await sampleFn.json(prompt,{modelTier:'quick',signal:bulk.ctl.signal});
      const arr=Array.isArray(out)?out:(out&&Array.isArray(out.items)?out.items:[]);
      // 文字始终用她的原文；Claude 只提供标签，按序号对应
      bulk.rows=items.map((it,i)=>{const o=arr.find(x=>Number(x&&x.i)===i+1)||arr[i]||{};return rowFrom(Object.assign({},o,{text:it.text}),it.hint)});
      if(!arr.length)bulk.err='Claude 没有返回标签，已按你的分行导入，请手动选择分类。';
    }catch(e){
      bulk.rows=plain();
      if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='not_declared'||e.code==='capability_disabled'||e.code==='capability_removed'))sampleFn=null;
      bulk.err=e&&e.code==='cancelled'?'已停止，已按你的分行导入。':e&&e.code==='rate_limited'?'Claude 暂时太忙，已按你的分行导入，可稍后再试。':'没能拿到 Claude 的建议，已按你的分行导入，请手动选择分类。';
    }
    bulk.busy=false;bulk.ctl=null;render();
  }

  function buildReport(){
    const wk=weekKey(sel);const days=weekDays(wk);const inWeek=k=>days.includes(k);
    const mk=monthKey(sel);const nwk=nextKey('week',wk);
    const L=[];
    L.push('【周报】'+wk.replace('-W','年第')+'周（'+labelFor('week',wk)+'）');
    L.push('');
    // 一、目标进度
    const wg=[...routinesFor(wk,'week'),...goals.filter(g=>g.level==='week'&&g.period===wk&&!g.routine)];
    const wgDone=wg.filter(g=>g.status==='done');
    const pushed=goals.filter(g=>g.level==='week'&&(g.history||[]).includes(wk)&&g.period!==wk);
    const mg=[...routinesFor(mk,'month'),...goals.filter(g=>g.level==='month'&&g.period===mk&&!g.routine)];
    const dg=goals.filter(g=>g.level==='day'&&inWeek(g.period)&&!g.routine);
    const rtDays=days.filter(k=>k<=todayKey());const rtAll=rtDays.flatMap(k=>routinesFor(k,"day"));const rtDone=rtAll.filter(g=>g.status==='done').length;
    const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
    L.push('一、目标进度');
    L.push('· 本周计划：完成 '+wgDone.length+' / '+(wg.length+pushed.length)+'（'+pct(wgDone.length,wg.length+pushed.length)+'）');
    for(const g of wgDone)L.push('  ✓ '+g.title);
    for(const g of wg.filter(g=>g.status!=='done'))L.push('  ○ '+g.title+'（进行中）');
    for(const g of pushed)L.push('  → '+g.title+'（顺延至'+shortLabel('week',g.period)+(g.status==='done'?'，已完成':'')+'）');
    if(mg.length){const d=mg.filter(g=>g.status==='done').length;L.push('· '+Number(mk.split('-')[1])+'月目标：完成 '+d+' / '+mg.length+'（'+pct(d,mg.length)+'）');
      for(const g of mg.filter(g=>g.status!=='done'))L.push('  ○ '+g.title)}
    if(dg.length){const d=dg.filter(g=>g.status==='done').length;L.push('· 每日任务：本周 '+dg.length+' 项，完成 '+d+' 项（'+pct(d,dg.length)+'）')}
    if(rtAll.length)L.push('· 每日固定目标：完成 '+rtDone+' / '+rtAll.length+' 次（'+pct(rtDone,rtAll.length)+'）');
    if(!wg.length&&!pushed.length&&!mg.length&&!dg.length&&!rtAll.length)L.push('· 本周暂无目标记录');
    L.push('');
    // 二、会议
    const ev=days.flatMap(k=>events.filter(e=>occursOn(e,k)));
    if(ev.length){const c=k=>ev.filter(e=>(e.kind||'other')===k).length;
      L.push('二、会议与讨论：会议 '+c('meeting')+' 场，讨论 '+c('discussion')+' 场'+(c('other')?'，其他 '+c('other')+' 项':''));
      const tps=tasks.filter(t=>inWeek(t.evDate||t.due||'')&&tkItems(t).some(i=>i.outcome&&i.outcome.trim())).sort((a,b)=>(a.evDate||a.due)<(b.evDate||b.due)?-1:1);
      for(const t of tps){L.push('· '+shortLabel('day',t.evDate||t.due)+' '+(t.title||'会议')+' 结论：');for(const i of tkItems(t))if(i.outcome&&i.outcome.trim())L.push('  - '+i.text.split('\n')[0]+'：'+i.outcome.trim().replace(/\s*\n\s*/g,'；'))}
      L.push('')}
    // 三、Learnings：按业务 → 现行/待优化分组，规则/口径标【规则】
    const nt=notes.filter(n=>inWeek(n.date)&&!(n.task&&!normCat(n.cat)));
    const num=ev.length?'三':'二';
    L.push(num+'、本周 Learnings（'+nt.length+' 条）');
    if(!nt.length)L.push('· 暂无记录');
    const groups=[...PROGS.map(p=>({k:p.k,n:p.n})),{k:'',n:'其他'}];
    const tag=n=>{const c=normCat(n.cat);return c==='rule'?'【规则】':c==='case'?'【个案】':c==='idea'?'【优化】':c==='doubt'?(n.done?'【已确认】':'【待确认】'):''};
    for(const g of groups){
      const xs=nt.filter(n=>(n.prog||'')===g.k);if(!xs.length)continue;
      L.push('· '+g.n+'：');
      const tracks=[...TRACKS,{k:'',n:''}];
      for(const t of tracks){
        const ys=xs.filter(n=>(n.track||'')===t.k).sort((a,b)=>(normCat(a.cat)==='rule'?0:1)-(normCat(b.cat)==='rule'?0:1));
        if(!ys.length)continue;
        if(t.n)L.push('  '+t.n+'：');
        for(const n of ys)L.push((t.n?'   - ':'  - ')+tag(n)+n.text.replace(/\s*\n\s*/g,'；'));
      }
    }
    L.push('');
    // 四、待跟进
    const nextNum=ev.length?'四':'三';
    const openTasks=notes.filter(n=>n.task&&!n.done&&n.date<=days[6]);
    const openDoubts=notes.filter(n=>normCat(n.cat)==='doubt'&&!n.done&&!n.task&&n.date<=days[6]);
    L.push(nextNum+'、待跟进');
    if(!openTasks.length&&!openDoubts.length)L.push('· 无');
    for(const n of openTasks)L.push('· [待办] '+n.text.replace(/\s*\n\s*/g,'；')+(n.due?'（截止 '+shortLabel('day',n.due)+'）':''));
    for(const n of openDoubts)L.push('· [待确认] '+n.text);
    L.push('');
    // 五、下周计划
    const lastNum=ev.length?'五':'四';
    const ng=goals.filter(g=>g.level==='week'&&g.period===nwk);
    L.push(lastNum+'、下周计划（'+labelFor('week',nwk)+'）');
    if(!ng.length)L.push('· 待补充');
    for(const g of ng)L.push('· '+g.title+((g.history||[]).length?'（顺延）':''));
    return L.join('\n');
  }
